<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMS2 Season</title>
<link rel="stylesheet" href="/livery-editor.css">
<link rel="stylesheet" href="/bop-editor.css">
<link rel="stylesheet" href="/development-ui.css">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F6F8; --panel:#FFFFFF; --side:#ECEEF2; --ink:#1C2230; --muted:#5A6373; --faint:#8A93A3;
  --line:#DFE3E9; --row:#EEF1F5; --ai:#A9B0BB; --green:#178A4C; --amber:#B97A00; --red:#C81E2B;
  --focus:#2E86DE; --btn-ink:#FFFFFF; --track:#CBD1DA;
  --cond:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --sans:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#151A21; --panel:#1C222B; --side:#11151B; --ink:#E8EBF0; --muted:#A1A9B6; --faint:#77808F;
  --line:#2C333F; --row:#222A35; --ai:#5E6676; --green:#45C784; --amber:#E2AE45; --red:#F2626B;
  --focus:#5AA4F0; --btn-ink:#151A21; --track:#3A4350;
}}
:root[data-theme="dark"]{
  --paper:#151A21; --panel:#1C222B; --side:#11151B; --ink:#E8EBF0; --muted:#A1A9B6; --faint:#77808F;
  --line:#2C333F; --row:#222A35; --ai:#5E6676; --green:#45C784; --amber:#E2AE45; --red:#F2626B;
  --focus:#5AA4F0; --btn-ink:#151A21; --track:#3A4350;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--sans);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.shell{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 14px;font:700 1.35rem/1 var(--cond);letter-spacing:.01em}
.brand svg{flex:none}
nav{display:flex;flex-direction:column;padding:4px 10px;gap:2px;overflow-y:auto;flex:1;min-height:0}
nav a,nav button.navlink{display:block;text-decoration:none;padding:8px 12px;border-radius:7px;color:var(--ink);
  border:0;background:none;text-align:left;cursor:pointer;font-weight:500}
nav a:hover,nav button.navlink:hover{background:var(--row)}
nav a.active{background:var(--panel);box-shadow:0 0 0 1px var(--line)}
nav .group{color:var(--faint);font-size:.82rem;padding:16px 12px 4px}
nav .champlink{font-weight:400;padding-left:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button.navlink.add{color:var(--muted);font-weight:400;padding-left:20px}

.rec{margin:12px;padding:14px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.rec .state{display:flex;align-items:center;gap:10px;font-weight:600}
.light{width:12px;height:12px;border-radius:50%;flex:none;background:var(--ai)}
.light.recording{background:var(--red);box-shadow:0 0 0 0 var(--red);animation:onair 1.6s ease-out infinite}
.light.connected{background:var(--green)} .light.waiting{background:var(--amber)} .light.off{background:transparent;box-shadow:inset 0 0 0 2px var(--faint)}
@keyframes onair{0%{box-shadow:0 0 0 0 rgba(200,30,43,.55)}70%{box-shadow:0 0 0 9px rgba(200,30,43,0)}100%{box-shadow:0 0 0 0 rgba(200,30,43,0)}}
@media (prefers-reduced-motion:reduce){.light.recording{animation:none}}
.rec .detail{color:var(--muted);font-size:.88rem;margin:6px 0 10px}
.rec button{width:100%}

main{overflow-y:auto;min-height:0}
.view{max-width:1180px;margin:0 auto;padding:clamp(20px,4vw,44px) clamp(18px,4vw,44px) 80px}
h1{font:600 clamp(2.1rem,4.4vw,3.4rem)/1 var(--cond);margin:0;letter-spacing:-.005em}
h2{font:600 1.5rem/1.15 var(--cond);margin:0 0 4px}
h3{font:600 1.1rem/1.2 var(--sans);margin:0 0 8px}
.sub{color:var(--muted);margin:10px 0 0;max-width:70ch}
.explain{color:var(--muted);margin:0 0 14px;font-size:.93rem;max-width:72ch}
section{margin-top:clamp(28px,4vw,44px)}
.headrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:var(--ink);
  color:var(--btn-ink);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn.small{padding:5px 10px;font-size:.88rem;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.9rem}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.pad{padding:clamp(14px,2vw,20px)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font:600 .8rem/1.2 var(--sans);color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
td.pace-notes{white-space:normal;min-width:220px;max-width:440px}
tr.click{cursor:pointer} tr.click:hover{background:var(--row)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.pos{font:600 1.1rem/1 var(--cond)}
.badge{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge.live{color:var(--red);border-color:var(--red)}
.badge.filed{color:var(--green);border-color:var(--green)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:24px;overflow-x:auto}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a.active{color:var(--ink);border-bottom-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--btn-ink)}

.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.kicker{color:var(--muted);font-weight:500;margin:0 0 6px}
.lede{font:500 1.2rem/1.45 var(--sans);margin:12px 0 0;max-width:60ch}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.item .m{color:var(--muted);font-size:.9rem}
.empty{padding:28px;text-align:left;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(20px,3vw,36px);align-items:start}
@media (max-width:960px){.grid2{grid-template-columns:minmax(0,1fr)}}
ul.hl{list-style:none;margin:0;padding:0}
ul.hl li{padding:10px 0;border-bottom:1px solid var(--line)}
ul.hl li:last-child{border-bottom:0}

label.field{display:block;margin:0 0 16px}
label.field > span{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
label.field small,.hint{display:block;color:var(--muted);font-size:.85rem;margin-top:4px}
input[type=text],input[type=number],select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
input[type=number]{max-width:120px}
input:focus,select:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.radio{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;background:var(--panel)}
.radio input{margin-top:4px}
.radio b{display:block}
.radio span{color:var(--muted);font-size:.9rem}
.check{display:flex;gap:10px;align-items:center;margin:0 0 16px}
.driverrow{display:grid;grid-template-columns:14px minmax(120px,1fr) minmax(160px,2fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px dashed var(--faint);background:none;border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--ink)}
.chip:hover{border-style:solid}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.danger-zone{border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.points-preview{color:var(--muted);font-size:.88rem;margin-top:6px}

.matrix td{text-align:center;min-width:64px}
.matrix td.win{color:var(--green);font-weight:600}
.matrix td.lose{color:var(--red)}
.matrix td.self{color:var(--faint)}

iframe.report{width:100%;border:0;display:block;min-height:70vh;background:var(--paper)}
.racebar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px clamp(18px,4vw,44px);
  border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:2}
.racebar .title{font-weight:600}
.drawer{padding:16px clamp(18px,4vw,44px);border-bottom:1px solid var(--line);background:var(--side)}
pre.log{font:12px/1.5 ui-monospace,Consolas,monospace;max-height:280px;overflow:auto;margin:0;white-space:pre-wrap;color:var(--muted)}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;width:min(520px,92vw)}
dialog::backdrop{background:rgba(10,14,20,.45)}
dialog form{padding:22px}
dialog h2{margin-bottom:14px}
dialog .actions{justify-content:flex-end;margin-top:8px}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:10}
.toast{background:var(--ink);color:var(--btn-ink);padding:12px 16px;border-radius:9px;max-width:380px;display:flex;gap:12px;align-items:center}
.toast.err{background:var(--red);color:#fff}
.toast button{background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:4px 10px;cursor:pointer}
.spinner{color:var(--muted);padding:40px 0}
svg text{font-family:var(--sans);fill:var(--ink)}
@media (max-width:820px){.shell{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  aside{border-right:0;border-bottom:1px solid var(--line)} nav{flex-direction:row;flex-wrap:wrap;flex:none}
  nav .group{display:none} .rec{margin:0 10px 10px}}

/* replay */
.rp{display:flex;flex-direction:column;height:100%;min-height:520px}
.rp-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 310px}
.rp-stage{position:relative;min-height:0;background:var(--panel);overflow:hidden}
.rp-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.rp-hud{position:absolute;left:18px;top:14px;font:600 1.6rem/1.1 var(--cond);pointer-events:none}
.rp-hud small{display:block;font:500 .9rem var(--sans);color:var(--muted);margin-top:2px}
.rp-caption{position:absolute;left:18px;bottom:16px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.rp-caption div{background:var(--ink);color:var(--btn-ink);padding:6px 12px;border-radius:7px;font-weight:600;font-size:.92rem;width:max-content;max-width:90%}
.rp-side{border-left:1px solid var(--line);background:var(--side);overflow-y:auto;min-height:0;padding:12px 12px 20px}
.rp-side h3{font:600 1rem/1.2 var(--sans);margin:16px 4px 6px;color:var(--muted)}
.tw{display:grid;grid-template-columns:24px 4px minmax(0,1fr) auto;gap:0 9px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:.9rem}
.tw:hover{background:var(--row)} .tw.on{background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.tw .p{font:600 1rem/1 var(--cond);text-align:right} .tw .bar{height:16px;border-radius:2px;background:var(--ai)}
.tw .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .tw .n.ai{color:var(--muted)}
.tw .n img{width:44px !important;height:25px !important;margin-right:5px !important}
.tw .g{color:var(--muted);font-size:.85rem;white-space:nowrap}
.tw .g.flag{color:var(--amber);font-weight:600} .tw .g.out{color:var(--red)}
.feed{display:flex;flex-direction:column}
.feed button{text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 6px;cursor:pointer;color:var(--ink);font-size:.86rem}
.feed button:hover{background:var(--row)} .feed .k{font-weight:600;margin-right:6px}
.rp-controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 16px;border-top:1px solid var(--line);background:var(--paper)}
.rp-controls .play{width:44px;height:36px;padding:0}
.rp-time{font:600 1.05rem/1 var(--cond);min-width:92px}
.scrub{position:relative;flex:1;min-width:260px;height:34px}
.scrub input{position:absolute;left:0;right:0;top:9px;width:100%;margin:0;accent-color:var(--ink)}
.scrub .tick{position:absolute;bottom:0;width:2px;height:8px;border-radius:1px;pointer-events:none}
.scrub .lap{position:absolute;top:0;font-size:.68rem;color:var(--faint);transform:translateX(-50%);pointer-events:none}
.rp-controls select,.racebar select{width:auto}
.racebar .actions{align-items:center}
@media (max-width:900px){.rp-main{grid-template-columns:minmax(0,1fr)} .rp-side{max-height:260px;border-left:0;border-top:1px solid var(--line)}}
.awlist .aw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:10px 0;border-bottom:1px solid var(--line)}
.awlist .aw:last-child{border-bottom:0}
.awlist .tt{font-weight:600} .awlist .vv{font:600 1.05rem/1 var(--cond);white-space:nowrap} .awlist .dd{grid-column:1/-1;color:var(--muted);font-size:.93rem}
.awgroup h4{font:600 1.05rem/1.2 var(--cond);color:var(--muted);margin:18px 0 2px}
.pins{column-width:240px;column-gap:28px}
.pins .grp{break-inside:avoid;margin-bottom:12px}
.pins .grp b{display:block;font-size:.85rem;color:var(--muted);margin:6px 0 4px}
.pins label{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;padding:3px 0;cursor:pointer}
.pins label span small{display:block;color:var(--faint);font-size:.8rem}

.rp-left{display:flex;flex-direction:column;min-height:0;min-width:0}
.rp-left .rp-stage{flex:1}
.rp-tools{position:absolute;right:14px;top:12px;display:flex;gap:6px}
.rp-tools .btn{background:var(--panel)}
.rp-tele{height:250px;flex:none;border-top:1px solid var(--line);background:var(--paper);display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:0 18px;padding:12px 16px;overflow:hidden}
.tele-hint{grid-column:1/-1;align-self:center;color:var(--muted)}
.rp-tele.empty{height:46px;padding:0 16px}
.tele-read{display:flex;flex-direction:column;gap:6px;min-width:0}
.tele-read .tname{font-weight:600}
.tele-read .tspeed{font:600 2.4rem/1 var(--cond)} .tele-read .tspeed small{font:500 .9rem var(--sans);color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.82rem;font-weight:600;border:1px solid var(--line)}
.pill.brake{color:#fff;background:var(--red);border-color:var(--red)} .pill.throttle{color:#fff;background:var(--green);border-color:var(--green)} .pill.coast{color:var(--muted)}
.inputs div{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:8px;font-size:.82rem;margin-top:3px}
.inputs i{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden} .inputs b{display:block;height:100%}
.inputs div.muted{display:block}
.tele-chart{min-width:0;min-height:0;height:100%;display:flex;flex-direction:column}
.tele-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}
.tele-note{font-size:.88rem;line-height:1.35}
.tele-top select{width:auto;flex:none}
.tele-chart canvas{width:100%;flex:1;min-height:0;display:block}
.rp-delta{flex:none;height:142px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;padding:8px 16px;border-top:1px solid var(--line);background:var(--paper)}
.rp-delta[hidden]{display:none}
.delta-read{overflow:auto;font-size:.8rem}.delta-read b{font:600 1.3rem var(--cond)}
.delta-chart{min-width:0;min-height:0;display:flex;flex-direction:column}.delta-chart canvas{width:100%;flex:1;min-height:0}
@media(max-width:900px){.rp-delta{grid-template-columns:180px minmax(0,1fr)}}
.tw{grid-template-columns:16px 24px 4px minmax(0,1fr) auto !important}
.tw input{margin:0;cursor:pointer}
.tw.off{opacity:.42}
.tw.grp{box-shadow:inset 3px 0 0 var(--ink);background:var(--panel)}
.tw-tools{display:flex;gap:14px;padding:2px 6px 8px}
.tw-tools .link{font-size:.84rem}
.rp:fullscreen{height:100vh;background:var(--paper)}
.fsable{position:relative}
.fsbtn{position:absolute;top:10px;right:10px;z-index:1}
.fsable:fullscreen{background:var(--paper);padding:28px;display:flex;flex-direction:column;justify-content:center;overflow:auto}
.fsable:fullscreen svg{width:100% !important;height:calc(100vh - 80px) !important;min-width:0 !important;max-height:none !important}
.fsable:fullscreen table{font-size:1.25rem} .fsable:fullscreen td,.fsable:fullscreen th{padding:14px 18px}
@media (max-width:900px){.rp-tele{grid-template-columns:minmax(0,1fr);height:auto}}

.q-tele{height:330px;grid-template-columns:240px minmax(0,1fr)}
.q-main{grid-template-columns:minmax(0,1fr) 390px}
.q-legend{position:absolute;left:18px;bottom:14px;display:flex;gap:14px;font-size:.82rem;color:var(--muted);pointer-events:none}
.q-legend span{display:inline-flex;align-items:center;gap:6px}
.mk-b{width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid var(--red);display:inline-block}
.mk-t{width:10px;height:10px;border-radius:50%;border:2.5px solid var(--green);display:inline-block}
.q-row{grid-template-columns:16px 24px 4px minmax(0,1fr) auto auto !important}
.q-row .qt{font:600 .92rem var(--cond);margin-right:4px}
.tw .g.lose,.qd.lose,.qdelta.lose{color:var(--red)} .tw .g.gain,.qd.gain,.qdelta.gain{color:var(--green)}
.tw.refrow .n{font-weight:700}
.qdelta{font:600 1.3rem/1 var(--cond)}
.q-debrief .qsum{margin:4px 4px 10px;font-weight:500}
.qzone{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 4px;cursor:pointer;color:var(--ink);font-size:.88rem}
.qzone:hover{background:var(--row)} .qd{font:600 .95rem var(--cond)}
.rp-side > select{width:100%;margin:0 0 10px}
.wheelbox{display:flex;gap:10px;align-items:center;margin-top:4px;font-size:.85rem}
.wheel{width:44px;height:44px;border-radius:50%;border:5px solid var(--ink);position:relative;transition:transform .08s linear}
.wheel i{position:absolute;left:50%;top:-5px;width:4px;height:12px;margin-left:-2px;background:var(--red);border-radius:2px}
.wheel::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:5px;margin-top:-2px;background:var(--ink);border-radius:2px}

.viewmenu{position:relative}
.viewmenu summary{list-style:none;cursor:pointer}
.viewmenu summary::-webkit-details-marker{display:none}
.viewmenu .menu{position:absolute;right:0;top:calc(100% + 6px);z-index:8;background:var(--panel);border:1px solid var(--line);border-radius:10px;
