<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMS2 Livery Editor</title>
<style>
  :root {
    --bg:#121417; --panel:#1a1d22; --panel2:#20242a; --line:#2d3239; --line2:#3a4049; --text:#e8eaee; --muted:#959ca8;
    --accent:#ff6a1a; --accent2:#ff8a47; --sel:#2b3440; --danger:#ff5d5d; --ok:#4cc38a;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.35 system-ui, "Segoe UI", sans-serif; overflow:hidden; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:5px 9px; cursor:pointer; white-space:nowrap; }
  button:hover:not(:disabled) { border-color:var(--line2); background:#262b32; }
  button:disabled { opacity:.45; cursor:default; }
  button.accent { background:var(--accent); border-color:var(--accent); color:#111; font-weight:600; }
  button.accent:hover { background:var(--accent2); }
  button.on { background:var(--sel); border-color:var(--accent); color:#fff; }
  select, input[type=text], input[type=number], textarea { background:#0f1114; border:1px solid var(--line); border-radius:6px; padding:5px 7px; }
  textarea { width:100%; resize:vertical; min-height:52px; }
  input[type=color] { width:30px; height:26px; border:1px solid var(--line); border-radius:6px; background:#0f1114; padding:2px; cursor:pointer; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  label { color:var(--muted); }
  .app { display:grid; height:100%; grid-template-rows:46px 1fr; grid-template-columns:52px 268px 1fr 270px;
         grid-template-areas:"top top top top" "tools opts view layers"; }
  #top { grid-area:top; display:flex; align-items:center; gap:8px; padding:0 10px; background:var(--panel); border-bottom:1px solid var(--line); }
  #top .brand { font-weight:700; letter-spacing:.02em; margin-right:6px; }
  #top .brand span { color:var(--accent); }
  #top .grow { flex:1; }
  #top select { max-width:240px; }
  .sep { width:1px; height:24px; background:var(--line); margin:0 2px; }
  #tools { grid-area:tools; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 0; overflow-y:auto; }
  #tools button { width:38px; height:38px; padding:0; display:grid; place-items:center; border-color:transparent; background:transparent; }
  #tools button:hover { background:var(--panel2); }
  #tools button.on { background:var(--sel); border-color:var(--accent); }
  #tools svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  #tools .gap { height:8px; }
  #opts { grid-area:opts; background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:10px 12px 40px; }
  #layers { grid-area:layers; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  #view { grid-area:view; position:relative; overflow:hidden; background:#16181c; }
  #view canvas { display:block; width:100%; height:100%; touch-action:none; }
  #handles { position:absolute; inset:0; pointer-events:none; overflow:visible; }
  #handles .h { pointer-events:all; cursor:pointer; }
  h3 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; }
  h4 { margin:14px 0 6px; font-size:12px; color:var(--text); font-weight:600; }
  .row { display:flex; align-items:center; gap:6px; margin:6px 0; }
  .row > label { flex:0 0 86px; }
  .row .val { flex:0 0 56px; white-space:nowrap; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
  .row .fill { flex:1; min-width:0; }
  .seg { display:flex; flex-wrap:wrap; gap:3px; }
  .seg button { padding:4px 8px; }
  .grid { display:grid; grid-template-columns:repeat(5, 1fr); gap:4px; }
  .grid button { padding:3px; aspect-ratio:1; display:grid; place-items:center; }
  .grid canvas, .grid img { width:100%; height:100%; object-fit:contain; }
  .lib { display:grid; grid-template-columns:repeat(4, 1fr); gap:4px; max-height:420px; overflow-y:auto; }
  .lib button { padding:3px; aspect-ratio:1; background:repeating-conic-gradient(#2a2e35 0 25%, #1f2328 0 50%) 0 0/12px 12px; }
  .lib img { width:100%; height:100%; object-fit:contain; display:block; }
  .note { color:var(--muted); font-size:12px; margin:6px 0; }
  .note.warn { color:#ffb37a; }
  .colours { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .colours input[type=color] { width:38px; height:32px; }
  .recent { display:flex; flex-wrap:wrap; gap:3px; margin:4px 0 8px; }
  .recent button { width:18px; height:18px; padding:0; border-radius:4px; }
  hr { border:0; border-top:1px solid var(--line); margin:12px 0; }
  #layerList { flex:1; overflow-y:auto; padding:4px 6px; min-height:120px; }
  .layer { display:flex; align-items:center; gap:6px; padding:5px 6px; border:1px solid transparent; border-radius:6px; cursor:pointer; user-select:none; }
  .layer:hover { background:var(--panel2); }
  .layer.active { background:var(--sel); border-color:var(--accent); }
  .layer .eye { width:22px; height:22px; padding:0; display:grid; place-items:center; background:transparent; border-color:transparent; }
  .layer .eye.off { opacity:.35; }
  .layer .kind { width:16px; text-align:center; color:var(--muted); font-size:11px; }
  .layer .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .layer .meta { color:var(--muted); font-size:11px; }
  .layer.base { border-top:1px dashed var(--line); margin-top:4px; border-radius:0 0 6px 6px; }
  .layerBtns { display:flex; flex-wrap:wrap; gap:4px; padding:6px 8px; border-top:1px solid var(--line); }
  .layerBtns button { padding:4px 7px; }
  #layerProps { border-top:1px solid var(--line); padding:8px 12px 14px; overflow-y:auto; max-height:46%; }
  #views { position:absolute; top:10px; left:10px; display:flex; gap:3px; }
  #views button { padding:3px 8px; font-size:12px; background:rgba(20,22,26,.8); }
  #hint { position:absolute; left:50%; bottom:10px; transform:translateX(-50%); background:rgba(20,22,26,.88); border:1px solid var(--line);
          border-radius:999px; padding:5px 14px; color:var(--muted); font-size:12px; white-space:nowrap; max-width:calc(100% - 20px); overflow:hidden; text-overflow:ellipsis; pointer-events:none; }
  #toast { position:absolute; top:12px; left:50%; transform:translateX(-50%); background:#22262c; border:1px solid var(--line2); border-radius:8px;
           padding:8px 14px; display:none; max-width:80%; box-shadow:0 6px 20px rgba(0,0,0,.4); }
  #toast.err { border-color:var(--danger); }
  #toast.ok { border-color:var(--ok); }
  #busy { position:absolute; inset:0; display:none; place-items:center; background:rgba(10,12,14,.55); z-index:5; font-size:15px; }
  #busy.show { display:grid; }
  .menu { position:relative; }
  .menu .dd { position:absolute; right:0; top:calc(100% + 4px); background:var(--panel); border:1px solid var(--line2); border-radius:8px; padding:4px;
              display:none; flex-direction:column; min-width:220px; z-index:20; box-shadow:0 8px 24px rgba(0,0,0,.5); }
  .menu.open .dd { display:flex; }
  .menu .dd button { text-align:left; background:transparent; border-color:transparent; }
  .menu .dd button:hover { background:var(--panel2); }
  #modalWrap { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; place-items:center; z-index:50; }
  #modalWrap.show { display:grid; }
  .modal { background:var(--panel); border:1px solid var(--line2); border-radius:12px; padding:18px 20px; width:min(480px, calc(100vw - 32px));
           max-height:calc(100vh - 40px); overflow-y:auto; box-shadow:0 18px 50px rgba(0,0,0,.5); }
  .modal h2 { margin:0 0 12px; font-size:17px; }
  .modal .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
  .modal .choice { display:flex; gap:8px; align-items:flex-start; padding:8px; border:1px solid var(--line); border-radius:8px; margin:6px 0; cursor:pointer; }
  .modal .choice.on { border-color:var(--accent); background:var(--sel); }
  .modal .choice input[type=radio] { margin-top:3px; accent-color:var(--accent); }
  .modal .choice > div { flex:1; }
  .modal .choice select { width:100%; margin-top:6px; }
  .shapeEd { background:repeating-conic-gradient(#2a2e35 0 25%, #1f2328 0 50%) 0 0/20px 20px; border:1px solid var(--line2); border-radius:6px; display:block; margin:6px auto; cursor:crosshair; touch-action:none; }
  .check { display:flex; align-items:center; gap:6px; margin:6px 0; color:var(--text); cursor:pointer; }
  .check input { accent-color:var(--accent); }
  .swatch { width:30px; height:26px; padding:0; border-radius:6px; border:1px solid var(--line2); }
  .swatch.big { width:38px; height:32px; }
  #picker { position:fixed; z-index:60; display:none; width:246px; background:var(--panel); border:1px solid var(--line2); border-radius:10px;
            padding:10px; box-shadow:0 12px 30px rgba(0,0,0,.55); }
  #picker canvas { display:block; border-radius:6px; cursor:crosshair; touch-action:none; }
  #picker .pkHue { margin:8px 0; border-radius:4px; }
  .pkRow { display:flex; align-items:center; gap:6px; }
  .pkSw { width:22px; height:22px; border-radius:5px; border:1px solid var(--line2); flex:0 0 auto; cursor:pointer; }
  .pkHex { width:78px; }
  #picker .recent { margin:8px 0 0; }
  .gBar { height:24px; border-radius:6px; border:1px solid var(--line2); cursor:copy; }
  .gMarks { position:relative; height:16px; margin:2px 7px 0; }
  .gStop { position:absolute; top:0; width:12px; height:14px; margin-left:-6px; cursor:ew-resize; border:1px solid #111;
           border-radius:2px 2px 6px 6px; background:var(--c); box-shadow:0 0 0 1px #888; touch-action:none; }
  .gStop.on { box-shadow:0 0 0 2px var(--accent); }
  #handles [data-pa] { cursor:move; }
  #handles [data-ph] { cursor:crosshair; }
  #banner { position:absolute; top:44px; left:50%; transform:translateX(-50%); background:#2a2216; border:1px solid #ffb37a; border-radius:8px;
            padding:8px 12px; display:none; gap:10px; align-items:center; max-width:calc(100% - 20px); z-index:4; }
  #banner.show { display:flex; }
  @media (max-width: 1100px) { .app { grid-template-columns:48px 230px 1fr 230px; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
<div class="app">
  <header id="top">
    <div class="brand">AMS2 <span>Livery</span> Editor</div>
    <select id="carSel" title="Car"></select>
    <button id="newBtn" title="Start a new livery or open a saved one">New / Open…</button>
    <span class="sep"></span>
    <button id="undoBtn" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button id="redoBtn" title="Redo (Ctrl+Y)">↷ Redo</button>
    <button id="symBtn" title="Mirror everything to the other side of the car (X)">⇋ Symmetry</button>
    <span class="grow"></span>
    <span id="projName" class="note" style="margin:0"></span>
    <div class="menu" id="fileMenu">
      <button id="fileBtn">Project ▾</button>
      <div class="dd">
        <button data-act="saveProject">Save project  (Ctrl+S)</button>
        <button data-act="saveProjectAs">Save project as…</button>
        <button data-act="openProject">Open project…</button>
        <hr style="margin:4px 0">
        <button data-act="importLayer">Import PNG as a layer…</button>
        <button data-act="downloadPng">Download livery PNG</button>
        <button data-act="viewer">Open the plain viewer</button>
      </div>
    </div>
    <button id="saveGameBtn" class="accent" title="Write this livery into Automobilista 2">Save to game</button>
  </header>
  <nav id="tools"></nav>
  <aside id="opts"></aside>
  <main id="view">
    <svg id="handles"></svg>
    <div id="views"></div>
    <div id="banner"></div>
    <div id="hint"></div>
    <div id="toast"></div>
    <div id="busy"><div id="busyText">Loading…</div></div>
  </main>
  <aside id="layers">
    <div style="padding:10px 12px 4px"><h3>Layers</h3></div>
    <div id="layerList"></div>
    <div class="layerBtns">
      <button id="addLayerBtn" title="New paint layer">+ Layer</button>
      <button id="dupLayerBtn" title="Duplicate">Duplicate</button>
      <button id="mergeLayerBtn" title="Merge into the layer below">Merge ↓</button>
      <button id="upLayerBtn" title="Move up">↑</button>
      <button id="downLayerBtn" title="Move down">↓</button>
      <button id="delLayerBtn" title="Delete layer">Delete</button>
    </div>
    <div id="layerProps"></div>
  </aside>
</div>
<div id="modalWrap"><div class="modal" id="modal"></div></div>
<input type="file" id="fileInput" accept="image/*" hidden>

<script type="importmap">
{ "imports": {
  "three": "/livery-designer/vendor/three/build/three.module.js",
  "three/addons/": "/livery-designer/vendor/three/examples/jsm/",
  "three-mesh-bvh": "/livery-designer/vendor/three-mesh-bvh/build/index.module.js"
} }
</script>
<script type="module" src="editor/app.js"></script>
</body>
</html>
