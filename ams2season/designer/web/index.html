<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMS2 Livery Viewer</title>
<style>
  :root { --bg:#16181c; --panel:rgba(24,26,31,.92); --line:#2c2f36; --text:#e9ebef; --muted:#9aa0aa; --accent:#ff6a1a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, "Segoe UI", sans-serif; overflow:hidden; }
  canvas { display:block; }
  #panel { position:fixed; top:16px; left:16px; width:300px; max-width:calc(100vw - 32px); background:var(--panel);
           border:1px solid var(--line); border-radius:10px; padding:14px 14px 12px; backdrop-filter: blur(6px); }
  h1 { font-size:15px; margin:0 0 10px; letter-spacing:.02em; }
  h1 span { color:var(--accent); }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  select { width:100%; background:#0f1114; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 8px; font:inherit; }
  #status { margin-top:10px; font-size:12px; color:var(--muted); min-height:1.4em; }
  #status.preview { color:var(--accent); }
  #status.err { color:#ff5d5d; }
  button { margin-top:8px; background:#0f1114; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:#4a4f59; }
  #hint { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); font-size:12px; color:var(--muted);
          background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:6px 14px; white-space:nowrap; }
  #drop { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(255,106,26,.12);
          border:3px dashed var(--accent); font-size:20px; pointer-events:none; }
  body.dragging #drop { display:flex; }
  #loading { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:var(--muted); display:none; }
  @media (max-width: 600px) { #hint { display:none; } }
</style>
</head>
<body>
<div id="panel">
  <h1>AMS2 <span>Livery</span> Viewer</h1>
  <label for="car">Car</label>
  <select id="car"></select>
  <label for="livery">Livery</label>
  <select id="livery"></select>
  <div id="status"></div>
  <button id="back" hidden>Back to game livery</button>
</div>
<div id="hint">drag to orbit · right-drag to pan · scroll to zoom · drop a PNG to preview it on the car</div>
<div id="drop">Drop your PNG to preview it on the car</div>
<div id="loading">Loading…</div>

<script type="importmap">
{ "imports": {
  "three": "/livery-designer/vendor/three/build/three.module.js",
  "three/addons/": "/livery-designer/vendor/three/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = id => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const setStatus = (t, cls = '') => { $('status').textContent = t; $('status').className = cls; };

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16181c);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(3, 6, -4); scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(7, 72), new THREE.MeshStandardMaterial({ color: 0x24272d, roughness: .95 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);

const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 200);
camera.position.set(-5.2, 1.9, -6.0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0, 0.55, 0);
controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 1.2; controls.maxDistance = 20;

function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

// ---- materials -------------------------------------------------------------------------
const flat = (c, extra = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.6, ...extra });
const paint = new THREE.MeshPhysicalMaterial({ color: 0xbbbbbb, roughness: 0.35, clearcoat: 1, clearcoatRoughness: 0.08 });
const rubber = flat(0x2c2d31, { roughness: 0.82 });
const MATS = [
  [['TREAD', 'TIRE', 'TYRE'], rubber],
  [['PAINT'], paint],
  [['GLASS', 'WINDOW', 'WINDSCREEN'], flat(0x101418, { roughness: 0.05, metalness: 0.2, transparent: true, opacity: 0.85 })],
  [['CARBON'], flat(0x16181a, { roughness: 0.45 })],
  [['WHEEL', 'RIM'], flat(0x2a2c30, { metalness: 0.7, roughness: 0.35 })],
  [['LIGHT'], flat(0xd8dde4, { roughness: 0.1, metalness: 0.4 })],
  [['DISC'], flat(0x55585e, { metalness: 0.8, roughness: 0.4 })],
];
const fallback = flat(0x3a3d42);
const pick = n => (MATS.find(([keys]) => keys.some(k => n.includes(k))) || [0, fallback])[1];

// ---- textures ----------------------------------------------------------------------------
const loader = new THREE.TextureLoader();
function useTexture(tex) {
  tex.flipY = false;                                   // D3D UV origin is top-left
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.channel = 1;                                     // liveries use TEXCOORD2 (exported as uv1)
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (paint.map) paint.map.dispose();
  paint.map = tex; paint.color.set(0xffffff); paint.needsUpdate = true;
}

// ---- car loading --------------------------------------------------------------------------
const b64 = (s, T) => { const u = Uint8Array.from(atob(s), c => c.charCodeAt(0)); return new T(u.buffer); };
let carGroup = null, currentCar = null, gameLivery = null;

async function api(path) {
  const r = await fetch(path);
  const ct = r.headers.get('content-type') || '';
  if (!r.ok) throw new Error(ct.includes('json') ? (await r.json()).error : r.statusText);
  return ct.includes('json') ? r.json() : r.blob();
}

async function loadCar(id) {
  currentCar = id; store.set('car', id);
  $('loading').style.display = 'block'; setStatus('Loading car…');
  try {
    const data = await api('api/car/' + encodeURIComponent(id));
    if (currentCar !== id) return;
    if (carGroup) { scene.remove(carGroup); carGroup.traverse(o => o.geometry && o.geometry.dispose()); }
    carGroup = new THREE.Group();
    for (const p of data.parts) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(b64(p.pos, Float32Array), 3));
      g.setAttribute('normal', new THREE.BufferAttribute(b64(p.nrm, Float32Array), 3));
      g.setAttribute('uv', new THREE.BufferAttribute(b64(p.uv0, Float32Array), 2));
      g.setAttribute('uv1', new THREE.BufferAttribute(b64(p.uv2, Float32Array), 2));
      const arrays = p.groups.map(grp => b64(grp.index, Uint32Array));
      const idx = new Uint32Array(arrays.reduce((n, a) => n + a.length, 0));
      const mats = []; let start = 0;
      arrays.forEach((a, i) => { idx.set(a, start); g.addGroup(start, a.length, i); mats.push(pick(p.groups[i].material)); start += a.length; });
      g.setIndex(new THREE.BufferAttribute(idx, 1));
      const mesh = new THREE.Mesh(g, mats);
      mesh.position.fromArray(p.offset); mesh.quaternion.set(...p.quat);
      carGroup.add(mesh);
    }
    carGroup.scale.x = -1;                               // Madness is left-handed; mirror so text reads correctly
    scene.add(carGroup);
    const box = new THREE.Box3().setFromObject(carGroup);
    controls.target.set(0, (box.min.y + box.max.y) * 0.45, (box.min.z + box.max.z) / 2);
    await loadLiveries(id);
  } catch (e) { setStatus('Could not load car: ' + e.message, 'err'); }
  finally { $('loading').style.display = 'none'; }
}

async function loadLiveries(id) {
  const list = await api('api/liveries/' + encodeURIComponent(id));
  const sel = $('livery'); sel.innerHTML = '';
  for (const lv of list) {
    const o = new Option(`${lv.id} · ${lv.name}${lv.ok ? '' : '  (file missing)'}`, lv.id);
    o.disabled = !lv.ok; sel.add(o);
  }
  const remembered = store.get('livery:' + id);
  const first = list.find(l => l.ok && String(l.id) === remembered) || list.find(l => l.ok);
  if (first) { sel.value = first.id; await loadLivery(id, first.id); }
  else setStatus('No livery textures found for this car', 'err');
}

async function loadLivery(car, lid) {
  setStatus('Loading livery…');
  try {
    const blob = await api(`api/livery/${encodeURIComponent(car)}/${lid}.png`);
    const url = URL.createObjectURL(blob);
    const tex = await loader.loadAsync(url); URL.revokeObjectURL(url);
    if (currentCar !== car) return;
    useTexture(tex); gameLivery = lid; store.set('livery:' + car, lid);
    setStatus(`Livery ${lid} from the game files`); $('back').hidden = true;
  } catch (e) { setStatus('Could not load livery: ' + e.message, 'err'); }
}

// ---- drag & drop preview -------------------------------------------------------------------
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
addEventListener('drop', async e => {
  e.preventDefault(); document.body.classList.remove('dragging');
  const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
  if (!f) return setStatus('Drop a PNG or JPG image', 'err');
  const url = URL.createObjectURL(f);
  try { useTexture(await loader.loadAsync(url)); setStatus(`Previewing ${f.name} (not installed)`, 'preview'); $('back').hidden = false; }
  catch { setStatus('Could not read that image', 'err'); }
  finally { URL.revokeObjectURL(url); }
});
$('back').onclick = () => gameLivery != null && loadLivery(currentCar, gameLivery);
$('car').onchange = e => loadCar(e.target.value);
$('livery').onchange = e => loadLivery(currentCar, +e.target.value);

// ---- start ----------------------------------------------------------------------------------
const cars = await api('api/cars');
const sel = $('car'); const groups = {};
for (const c of cars) {
  const label = c.pack || 'Other mod cars';
  if (!groups[label]) { groups[label] = document.createElement('optgroup'); groups[label].label = label; sel.append(groups[label]); }
  groups[label].append(new Option(c.name, c.id));
}
if (!cars.length) setStatus('No mod cars with loose meshes found', 'err');
else { const start = cars.find(c => c.id === store.get('car')) || cars[0]; sel.value = start.id; await loadCar(start.id); }
window.viewerReady = true;
</script>
</body>
</html>
