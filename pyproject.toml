[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ams2season"
version = "0.1.0"
description = "Record AMS2 multiplayer races (humans + AI) and turn them into championship standings and debrief stats"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.1", "pyarrow>=14", "pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ams2season = "ams2season.cli:main"

[tool.setuptools]
packages = ["ams2season"]

[tool.setuptools.package-data]
ams2season = ["app_ui.html", "assets/*", "assets/car_icons/*", "livery_editor.js", "livery_editor.css", "LIVERY_EDITOR_NOTICES.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
